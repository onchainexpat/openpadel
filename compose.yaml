# Kumi in Docker: Postgres, the server, Caddy with HTTPS, a nightly backup and point-in-time backups. Settings come
# from .env (copy deploy/docker/env.example). See deploy/docker/README.md.
name: kumi
services:
  db:
    # The Postgres image with pgBackRest (the Dockerfile's db stage). Its tag names what's in it, so an update that
    # doesn't change it leaves Postgres running.
    image: kumi-db:17.9-pgbackrest-2.57.0
    build: { context: ., target: db }
    # Each finished piece of the write-ahead log goes to the archive, at least once a minute while the club is busy.
    command: ["postgres", "-c", "archive_mode=on", "-c", "archive_command=/usr/local/bin/kumi-pgbackrest-archive-push %p", "-c", "archive_timeout=60"]
    environment:
      POSTGRES_USER: kumi
      POSTGRES_DB: kumi
      POSTGRES_PASSWORD: ${OPENPADEL_DB_PASSWORD:-${KUMI_DB_PASSWORD:?set OPENPADEL_DB_PASSWORD in .env}}
      OPENPADEL_DB_PASSWORD: ${OPENPADEL_DB_PASSWORD:-${KUMI_DB_PASSWORD}}   # for kumi_app, the role the server connects as (db-init.sh)
    volumes:
      - db:/var/lib/postgresql/data
      - ./deploy/docker/db-init.sh:/docker-entrypoint-initdb.d/10-kumi-app.sh:ro
      - pgrun:/var/run/postgresql          # its socket, for the pitr service
      - pitr:/var/lib/pgbackrest           # the archive on this machine
      - pitr-conf:/etc/pgbackrest:ro       # pgBackRest's settings, which the pitr service writes
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U kumi -d kumi"], interval: 5s, timeout: 5s, retries: 20 }
    restart: unless-stopped

  kumi:
    image: kumi-server:${OPENPADEL_TAG:-${KUMI_TAG:-local}}   # built here; deploy/docker/update.sh tags each release
    build: { context: ., target: server }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kumi_app:${OPENPADEL_DB_PASSWORD:-${KUMI_DB_PASSWORD}}@db/kumi
      OPENPADEL_PUBLIC_URL: https://staff.${OPENPADEL_HOST:-${KUMI_HOST:?set OPENPADEL_HOST in .env}}
      OPENPADEL_MEMBER_URL: https://${OPENPADEL_HOST:-${KUMI_HOST}}
      OPENPADEL_TRUST_PROXY: "1"              # Caddy (the web service) says who each visitor is; port 8790 isn't published
    volumes:
      - ./config:/etc/kumi:ro            # club.yaml and member lists for the kumi command
      - ./backups:/var/backups/kumi:ro   # so kumi doctor can see the backups
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped

  web:
    image: kumi-web:${OPENPADEL_TAG:-${KUMI_TAG:-local}}
    build: { context: ., target: web }
    environment: { OPENPADEL_HOST: "${OPENPADEL_HOST:-${KUMI_HOST}}" }
    ports: ["${OPENPADEL_HTTP_PORT:-${KUMI_HTTP_PORT:-80}}:80", "${OPENPADEL_HTTPS_PORT:-${KUMI_HTTPS_PORT:-443}}:443", "${OPENPADEL_HTTPS_PORT:-${KUMI_HTTPS_PORT:-443}}:443/udp"]
    volumes: [caddy-data:/data, caddy-config:/config]
    depends_on: [kumi]
    restart: unless-stopped

  # Every night at 3:17 on the club's clock: the dump and its manifest in ./backups (kept 14 days), and the
  # offsite copy if it's set up in .env. On the 1st of each month at 4:17, the restore test too. It wakes every
  # hour and `--scheduled` runs each only when it's due, so the container's own clock (UTC) doesn't matter.
  backup:
    image: kumi-server:${OPENPADEL_TAG:-${KUMI_TAG:-local}}
    pull_policy: never                   # the server's own image, built for the kumi service
    user: "0:0"                          # ./backups may be root's from before
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kumi_app:${OPENPADEL_DB_PASSWORD:-${KUMI_DB_PASSWORD}}@db/kumi
      OPENPADEL_PUBLIC_URL: https://staff.${OPENPADEL_HOST:-${KUMI_HOST}}   # a club's export records its address; restoring one compares it
      OPENPADEL_MEMBER_URL: https://${OPENPADEL_HOST:-${KUMI_HOST}}
    volumes: ["./backups:/var/backups/kumi"]
    entrypoint: ["sh", "-c", "while true; do sleep $$(( (1020 - $$(date +%s) % 3600 + 3600) % 3600 + 1 )); kumi backup --scheduled; kumi restore-test --scheduled; done"]
    depends_on: { db: { condition: service_healthy }, kumi: { condition: service_started } }
    restart: unless-stopped

  # Point-in-time backups (deploy/docker/pitr.sh): any minute of the last 14 days on this machine, and of the last 30
  # offsite once offsite backups are set up, sealed with OPENPADEL_BACKUP_KEY. A base backup every night at 3:37 club
  # time, the monthly test on the 1st, and `kumi restore --to` here. It runs as Postgres's own user, with the database's
  # folder read-only and Postgres's socket, so pgBackRest can ask Postgres for its backups; the club's database
  # itself it opens as kumi_app, like the server.
  pitr:
    image: kumi-pitr:${OPENPADEL_TAG:-${KUMI_TAG:-local}}
    build: { context: ., target: pitr }
    init: true                           # reaps the scratch copies' Postgres and passes on docker compose stop
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kumi_app:${OPENPADEL_DB_PASSWORD:-${KUMI_DB_PASSWORD}}@db/kumi
      OPENPADEL_PUBLIC_URL: https://staff.${OPENPADEL_HOST:-${KUMI_HOST}}
      OPENPADEL_MEMBER_URL: https://${OPENPADEL_HOST:-${KUMI_HOST}}
      OPENPADEL_PITR_PG_USER: kumi            # Postgres's superuser here (POSTGRES_USER above): pgBackRest's, never the club's
    volumes:
      - db:/var/lib/postgresql/data:ro
      - pgrun:/var/run/postgresql
      - pitr:/var/lib/pgbackrest
      - pitr-conf:/etc/pgbackrest
      - pitr-work:/var/lib/kumi-pitr     # scratch copies, and the copy a restore takes (and the one it keeps)
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped

volumes: { db: {}, caddy-data: {}, caddy-config: {}, pgrun: {}, pitr: {}, pitr-conf: {}, pitr-work: {} }
