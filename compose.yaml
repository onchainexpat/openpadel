# Kumi in Docker: Postgres, the server, Caddy with HTTPS, and a nightly backup. Settings come from .env
# (copy deploy/docker/env.example). See deploy/docker/README.md.
name: kumi
services:
  db:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_USER: kumi
      POSTGRES_DB: kumi
      POSTGRES_PASSWORD: ${KUMI_DB_PASSWORD:?set KUMI_DB_PASSWORD in .env}
    volumes: [db:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U kumi -d kumi"], interval: 5s, timeout: 5s, retries: 20 }
    restart: unless-stopped

  kumi:
    image: kumi-server:${KUMI_TAG:-local}   # built here; deploy/docker/update.sh tags each release
    build: { context: ., target: server }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kumi:${KUMI_DB_PASSWORD}@db/kumi
      KUMI_PUBLIC_URL: https://staff.${KUMI_HOST:?set KUMI_HOST in .env}
      KUMI_MEMBER_URL: https://${KUMI_HOST}
      KUMI_TRUST_PROXY: "1"              # Caddy (the web service) says who each visitor is; port 8790 isn't published
    volumes:
      - ./config:/etc/kumi:ro            # club.yaml and member lists for the kumi command
      - ./backups:/var/backups/kumi:ro   # so kumi doctor can see the backups
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped

  web:
    image: kumi-web:${KUMI_TAG:-local}
    build: { context: ., target: web }
    environment: { KUMI_HOST: "${KUMI_HOST}" }
    ports: ["${KUMI_HTTP_PORT:-80}:80", "${KUMI_HTTPS_PORT:-443}:443", "${KUMI_HTTPS_PORT:-443}:443/udp"]
    volumes: [caddy-data:/data, caddy-config:/config]
    depends_on: [kumi]
    restart: unless-stopped

  # Every night at 3:17 on the club's clock: the dump and its manifest in ./backups (kept 14 days), and the
  # offsite copy if it's set up in .env. On the 1st of each month at 4:17, the restore test too. It wakes every
  # hour and `--scheduled` runs each only when it's due, so the container's own clock (UTC) doesn't matter.
  backup:
    image: kumi-server:${KUMI_TAG:-local}
    pull_policy: never                   # the server's own image, built for the kumi service
    user: "0:0"                          # ./backups may be root's from before
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kumi:${KUMI_DB_PASSWORD}@db/kumi
    volumes: ["./backups:/var/backups/kumi"]
    entrypoint: ["sh", "-c", "while true; do sleep $$(( (1020 - $$(date +%s) % 3600 + 3600) % 3600 + 1 )); kumi backup --scheduled; kumi restore-test --scheduled; done"]
    depends_on: { db: { condition: service_healthy }, kumi: { condition: service_started } }
    restart: unless-stopped

volumes: { db: {}, caddy-data: {}, caddy-config: {} }
