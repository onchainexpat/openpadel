# Your club, for `openpadel setup`. Copy it to club.yaml and change it to match your club, then:
#   openpadel setup plan club.yaml     shows what would change (changes nothing)
#   openpadel setup apply club.yaml    makes those changes
# Running it again only adds what's new. Renaming or removing things is done in the staff app.
# No secrets go in this file: Stripe, email and Playtomic keys go in the server's settings.
# Needed: the club's name and time_zone, and the owner's name and email. Everything marked (optional) can be left out
# (and set later in the staff app's Settings); so can every line that starts with #.

club:
  name: Kestrel Padel
  time_zone: America/Los_Angeles     # an IANA name: America/New_York, America/Chicago, Europe/Madrid...
  default_language: en               # (optional) en or es, en when left out; each person can choose their own
  currency: USD                      # (optional) the three-letter code (USD, the default, EUR, GBP, MXN...); only before the first payment
  # The club's own terms and privacy policy for members, on its website (templates in docs/templates). The app
  # links them where members join, beside the yes to texts and on the profile; joining agrees to them.
  # terms_url: https://kestrelpadel.example/terms
  # privacy_policy_url: https://kestrelpadel.example/privacy
  # How members reach the club and what it has, on their Home (Call, Website) and the public page. A phone without a +
  # is read in the club's country. amenities, any of: parking, showers, changing_rooms, lockers, cafe, pro_shop,
  # racket_rental, wifi, step_free, kids_area. Each is set when the club has none yet; after that, change it in Settings.
  # phone: "+1 503 555 0142"
  # website: https://kestrelpadel.example
  # amenities: [parking, showers, changing_rooms, cafe, racket_rental]
  # Owners and managers sign in with the emailed code; a passkey or authenticator app is their choice (Profile), and
  # the most sensitive changes ask for one. true: they give one at every sign-in too (also in Settings).
  # staff_second_step: true
  # The software your staff used before, so the staff app uses the words, menu order and first page they know:
  # playtomic (the default: Schedule, Bookings, Customers) or none (openPadel's own words: Courts, People, Programs).
  # It never changes what anyone can see or do. Also in Settings: each apply sets the file's value again, so once you
  # change it there, change it here too or take the line out (the same goes for brand_colour).
  # coming_from: playtomic
  # The club's colour in both apps (buttons, the page open in the menu, links). Also in Settings.
  # brand_colour: "#0B5A55"
  # What staff and members call the club's AI assistant: the button reads "Ask <name>". Just the name, up to 24
  # characters, the same in English and Spanish. Left out: openPadel (Kumi on Kumi's hosted service). Also in Settings.
  # assistant_name: Kestrel
  # The club's logo, in place of the mark drawn from its name: an SVG, PNG or JPEG under 1 MB, from this file's
  # folder (docs/setup/apps.md). In an SVG, turn text into outlines. logo_for: the background it's made for (dark for
  # a light logo, light for a dark one); left out, it's read from the logo. Also in Settings, next to the colour.
  # logo: logo.svg
  # logo_for: dark

owner:                               # signs in by a code sent to this address
  name: Robin Hale
  email: robin@kestrelpadel.example

locations:                           # (optional, but the club has no courts without one)
  - name: Eastside                   # needed for each location
    address: 100 Example St, Springfield, OR 97477   # (optional) shown to members; also in the staff app's Settings
    courts:                          # (optional) a name, or a name and kind: indoor, covered_outdoor or outdoor
      - Court 1
      - Court 2
      - { name: Court 3, kind: covered_outdoor }
    hours:                           # (optional) opening hours, set when the location has none yet; a day no line names is closed
      - { days: [mon, tue, wed, thu, fri], opens: "07:00", closes: "22:00" }
      - { days: [sat, sun], opens: "08:00", closes: "20:00" }
    price_per_hour: 32               # (optional) one price for every court here, every day at every hour, in the club's currency
                                     # (set when the location has no prices yet; peak and member prices go in Settings)

staff:                               # (optional) name, email and role for each; roles: manager, front_desk, coach, accountant (or another owner)
  - { name: Dana Ortiz, email: dana@kestrelpadel.example, role: manager }
  - { name: Sam Patel, email: sam@kestrelpadel.example, role: coach }
  # Kept to one location: that location's desk, plus people, tags, questions, levels and alerts of no place;
  # messages to groups, templates, the club's facts, tag renames and members' data stay with staff who cover the
  # whole club (docs/setup, roles).
  - { name: Lee Chen, email: lee@kestrelpadel.example, role: front_desk, location: Eastside }

# Texts (optional): the business as it's registered, for `openpadel texting`, which registers the club's texting
# with US carriers through its own Twilio account (docs/setup/accounts/twilio.md). The Twilio keys go in the
# server's settings, never here. `openpadel texting plan` says what's still missing.
texting:
  business_name: Kestrel Padel LLC                # the legal name, exactly as on the IRS letter for its EIN
  doing_business_as: Kestrel Padel                # optional: the name members know
  business_type: private_profit                   # private_profit, public_profit, non_profit, government or sole_proprietor
  registration_number: "12-3456789"               # the EIN (a Canadian club: its business number); not for a sole proprietor
  website: https://kestrelpadel.example           # live and public, about this club
  # The privacy policy and terms Twilio's reviewers read are the club's own, under club: above (or in Settings).
  address: { street: 100 Example St, city: Springfield, state: OR, postal_code: "97477" }   # country: US (or CA)
  contact: { first_name: Robin, last_name: Hale, email: robin@kestrelpadel.example, phone: "+15035550123" }
  monthly_texts: 1000                             # about how many a month; a guess is fine
  # number: "+18885550123"                        # a toll-free number the club already has in Twilio (else openPadel buys one)
  # opt_in_image_urls: [https://kestrelpadel.example/texts-opt-in.png]   # screenshots of your own, besides openPadel's page
  # customer_profile_sid: BU...                   # only when texting through a host's Twilio account: the club's own Trust Hub profile
