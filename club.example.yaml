# Your club, for `kumi setup`. Copy it to club.yaml and change it to match your club, then:
#   kumi setup plan club.yaml     shows what would change (changes nothing)
#   kumi setup apply club.yaml    makes those changes
# Running it again only adds what's new. Renaming or removing things is done in the staff app.
# No secrets go in this file: Stripe, email and Playtomic keys go in the server's settings.

club:
  name: Kestrel Padel
  time_zone: America/Los_Angeles     # an IANA name: America/New_York, America/Chicago, Europe/Madrid...
  default_language: en               # en or es; each person can choose their own

owner:                               # signs in by a code sent to this address
  name: Robin Hale
  email: robin@kestrelpadel.example

locations:
  - name: Eastside
    address: 100 Example St, Springfield, OR 97477
    courts:                          # a name, or a name and kind: indoor, covered_outdoor or outdoor
      - Court 1
      - Court 2
      - { name: Court 3, kind: covered_outdoor }

staff:                               # roles: manager, front_desk, coach, accountant (or another owner)
  - { name: Dana Ortiz, email: dana@kestrelpadel.example, role: manager }
  - { name: Sam Patel, email: sam@kestrelpadel.example, role: coach }
  - { name: Lee Chen, email: lee@kestrelpadel.example, role: front_desk, location: Eastside }

# Texts (optional): the business as it's registered, for `kumi texting`, which registers the club's texting
# with US carriers through its own Twilio account (docs/setup/accounts/twilio.md). The Twilio keys go in the
# server's settings, never here. `kumi texting plan` says what's still missing.
texting:
  business_name: Kestrel Padel LLC                # the legal name, exactly as on the IRS letter for its EIN
  doing_business_as: Kestrel Padel                # optional: the name members know
  business_type: private_profit                   # private_profit, public_profit, non_profit, government or sole_proprietor
  registration_number: "12-3456789"               # the EIN (a Canadian club: its business number); not for a sole proprietor
  website: https://kestrelpadel.example           # live and public, about this club
  privacy_policy_url: https://kestrelpadel.example/privacy   # should say mobile numbers aren't shared for marketing
  # terms_url: https://kestrelpadel.example/terms
  address: { street: 100 Example St, city: Springfield, state: OR, postal_code: "97477" }   # country: US (or CA)
  contact: { first_name: Robin, last_name: Hale, email: robin@kestrelpadel.example, phone: "+15035550123" }
  monthly_texts: 1000                             # about how many a month; a guess is fine
  # number: "+18885550123"                        # a toll-free number the club already has in Twilio (else Kumi buys one)
  # opt_in_image_urls: [https://kestrelpadel.example/texts-opt-in.png]   # screenshots of your own, besides Kumi's page
