name: An idea
description: Something Kumi should do for a club, its staff or its players.
labels: [idea]
body:
  - type: textarea
    id: who
    attributes: { label: Who it's for and what they're trying to do, description: "A club owner taking someone off a full Americano, a coach moving a clinic..." }
    validations: { required: true }
  - type: textarea
    id: today
    attributes: { label: What happens today, description: "In Kumi, or how the club works around it." }
