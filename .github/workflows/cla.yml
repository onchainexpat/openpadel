# Asks each outside contributor to accept CLA.md once, by a comment on their pull request, and records it on the
# cla-signatures branch. It never checks out or runs the pull request's code, which pull_request_target requires.
name: CLA
on:
  pull_request_target:
    types: [opened, synchronize, closed]
  issue_comment:
    types: [created]
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write
jobs:
  cla:
    if: github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA and I agree'
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: onchainexpat,dependabot[bot],github-actions[bot]
          custom-pr-sign-comment: I have read the CLA and I agree
          custom-allsigned-prcomment: Everyone on this pull request has accepted the CLA. Thank you.
