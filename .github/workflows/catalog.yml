# Publishes the plugin catalog's index at https://plugins.openpadel.dev/catalog.json (GitHub Pages), whenever the
# catalog changes on main or when started by hand. It checks catalog.json is current first, so a club's server never
# reads an index the build tool wouldn't write. Actions are pinned to exact commits of releases at least two weeks old.
name: catalog
on:
  push:
    branches: [main]
    paths: ["catalog/**", ".github/workflows/catalog.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with: { node-version: 24.22.0, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: node catalog/tools/build.ts --check
      - name: The site
        run: |
          mkdir -p _site
          cp catalog/catalog.json _site/catalog.json
          printf '<!doctype html><meta charset="utf-8"><title>openPadel plugins</title><meta http-equiv="refresh" content="0; url=https://github.com/onchainexpat/openpadel/tree/main/catalog"><a href="https://github.com/onchainexpat/openpadel/tree/main/catalog">openPadel plugin catalog</a>\n' > _site/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d   # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
